[project]
name = "densnet"
version = "0.1.0"
description = "Dental radiography 3-class DenseNet121 classifier (dentin, enamel, pulp)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "commitizen>=4.17.0",
    "ruff>=0.16.2",
    "pytest>=8.0.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
version_files = [
    "docs/conf.py:release",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["densnet"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ISC",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["densnet", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
